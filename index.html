<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161F">
<meta name="color-scheme" content="dark">
<title>ひと呼吸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #14161F;
    --surface: #1E2230;
    --line: #2C3242;
    --text: #C9C2B0;
    --muted: #7C8497;
    --accent: #D9A441;
    --accent-dim: #6B5424;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }

  html{
    background: var(--bg);
    min-height:100%;
  }

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,sans-serif;
    overscroll-behavior:none;
  }

  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
  }

  /* ---------- 上部：進行バー ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 8px;
  }

  .timecode{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.06em;
    color:var(--accent);
    min-width:44px;
  }

  .bar{
    flex:1;
    height:4px;
    border-radius:2px;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }

  .bar-fill{
    position:absolute;
    inset:0 auto 0 0;
    width:0%;
    background:var(--accent);
    transition: width 1s linear;
  }

  .seg{
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.08em;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- 見出し ---------- */
  .kicker{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin: 30px 0 0;
  }

  /* ---------- フレーズカード ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: 12px 0;
  }

  .card{
    opacity:1;
    transition: opacity .45s ease;
  }

  .card.fading{ opacity:0; }

  .en{
    font-family:'Newsreader',serif;
    font-size:31px;
    line-height:1.34;
    font-weight:500;
    color:var(--accent);
    letter-spacing:-0.005em;
  }

  .rule{
    width:34px;
    height:1px;
    background:var(--accent-dim);
    margin: 20px 0;
  }

  .ja{
    font-size:15px;
    line-height:1.75;
    color:var(--muted);
  }

  .note{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:13px;
    line-height:1.7;
    color:var(--muted);
  }

  .note b{
    color:var(--accent);
    font-weight:700;
  }

  /* ---------- 下部アクション ---------- */
  .actions{
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }

  .actions.ready{
    opacity:1;
    transform:none;
    pointer-events:auto;
  }

  .go{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--bg);
    background:var(--accent);
    border:none;
    border-radius:14px;
    padding:17px;
    cursor:pointer;
  }

  .go:active{ opacity:.85; }

  .skip{
    background:none;
    border:none;
    color:var(--muted);
    font-size:14px;
    font-family:'Inter',sans-serif;
    padding:6px;
    cursor:pointer;
  }

  .tally{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
    margin-top:6px;
    min-height:14px;
  }

  .waiting{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    padding:17px;
  }

  @media (prefers-reduced-motion: reduce){
    .bar-fill, .card{ transition:none; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="timecode" id="timecode">0:45</div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="seg" id="seg">1/3</div>
  </div>

  <div class="kicker">Business English</div>

  <div class="stage">
    <div class="card" id="card">
      <div class="en" id="en"></div>
      <div class="rule"></div>
      <div class="ja" id="ja"></div>
      <div class="note" id="note"></div>
    </div>
  </div>

  <div id="footer">
    <div class="waiting" id="waiting">開くまで、あと少し</div>
    <div class="actions" id="actions">
      <button class="go" id="goBtn">Instagramを開く</button>
      <button class="skip" id="skipBtn">やっぱりやめておく</button>
    </div>
    <div class="tally" id="tally"></div>
  </div>

<script>
  const DURATION = 45;
  const PHRASE_COUNT = 3;            // 45秒を3フレーズに分割（15秒ずつ）
  const SLOT = DURATION / PHRASE_COUNT;
  const INSTAGRAM_APP_URL = 'instagram://app';
  const INSTAGRAM_WEB_URL = 'https://www.instagram.com/';

  const PHRASES = [
    { en:"Let's touch base next week.",
      ja:"来週、軽く状況共有しましょう。",
      note:"<b>touch base</b> は「短く連絡を取り合う」。ビジネス英語で最も頻出する表現の一つ。" },
    { en:"I'll loop you in on this.",
      ja:"この件、あなたも情報共有に入れておきます。",
      note:"<b>loop in</b> は「情報の輪に加える」。CCに追加する場面でほぼ毎日使われます。" },
    { en:"Let's circle back on this later.",
      ja:"この件は後であらためて話しましょう。",
      note:"<b>circle back</b> は「後で戻って再検討する」。持ち越しを伝える定番フレーズ。" },
    { en:"I'll keep you in the loop.",
      ja:"引き続き情報を共有しますね。",
      note:"<b>keep someone in the loop</b> は「情報を継続的に共有する」。進捗報告の締めに多用。" },
    { en:"Just following up on my last email.",
      ja:"先日のメールの件でフォローアップです。",
      note:"返信がないときのリマインドメールの冒頭で、ほぼ定型句として使われます。" },
    { en:"I wanted to reach out about this.",
      ja:"この件でご連絡したく思いました。",
      note:"<b>reach out</b> は「連絡する」。特に新規の相手への一報でよく使われる柔らかい表現。" },
    { en:"We're on the same page.",
      ja:"認識は揃っていますね。",
      note:"<b>on the same page</b> は「同じ理解に立っている」。確認・合意の場面で必須の表現。" },
    { en:"Moving forward, let's focus on this.",
      ja:"今後は、この点に注力しましょう。",
      note:"<b>moving forward</b> は「今後は」。会議やメールの結びで非常によく使われます。" },
    { en:"I'll take that as an action item.",
      ja:"それは私のタスクとして引き取ります。",
      note:"<b>action item</b> は「担当者付きのタスク」。議事録では欠かせない語。" },
    { en:"Let's sync up tomorrow.",
      ja:"明日、簡単に情報共有しましょう。",
      note:"<b>sync up</b> は「短時間で認識合わせをする」。カジュアルな打ち合わせの提案に。" },
    { en:"As per my last email...",
      ja:"先ほどのメールの通りですが…",
      note:"既に伝えた内容を指す表現。多用しすぎると角が立つので使用頻度には注意。" },
    { en:"Please advise on how to proceed.",
      ja:"今後の進め方についてご指示ください。",
      note:"<b>advise</b> は「助言・指示する」。判断を相手に委ねたいときの丁寧な依頼表現。" },
    { en:"For your reference, I've attached the file.",
      ja:"ご参考までにファイルを添付しました。",
      note:"<b>for your reference</b>(FYI)は「ご参考まで」。添付ファイルの案内に定番。" },
    { en:"Please respond at your earliest convenience.",
      ja:"できるだけ早めにご返信いただけますと幸いです。",
      note:"<b>at your earliest convenience</b> は「都合のつき次第すぐに」。丁寧な催促の締め。" },
    { en:"Could you keep me posted?",
      ja:"進捗があれば教えていただけますか。",
      note:"<b>keep someone posted</b> は「最新情報を伝え続ける」。進捗確認の定番表現。" },
    { en:"Sounds good to me.",
      ja:"それで問題ありません。",
      note:"提案への同意を示すもっとも一般的な相づち。口頭でもメールでも頻出。" },
    { en:"No worries at all.",
      ja:"まったく問題ありません。",
      note:"謝罪や依頼への軽い返答として、カジュアルなビジネスシーンで広く使われます。" },
    { en:"I'll get back to you shortly.",
      ja:"すぐに折り返しご連絡します。",
      note:"<b>get back to</b> は「後で返答する」。即答できないときの標準的な返し。" },
    { en:"The ball is in your court now.",
      ja:"今度はそちらの番です。",
      note:"<b>the ball is in your court</b> は「判断・対応がそちら側にある」という比喩表現。" },
    { en:"Let's get up to speed on this.",
      ja:"この件について状況を追いつかせましょう。",
      note:"<b>get up to speed</b> は「最新状況に追いつく」。新規参加者への説明時にも使えます。" },
    { en:"Let's get the ball rolling.",
      ja:"そろそろ始めましょう。",
      note:"<b>get the ball rolling</b> は「物事を動かし始める」。プロジェクト開始の合図に。" },
    { en:"I appreciate your quick response.",
      ja:"迅速なご返信ありがとうございます。",
      note:"素早い対応への感謝を伝える定型表現。メールの冒頭でよく使われます。" },
    { en:"Thanks for your patience.",
      ja:"お待ちいただきありがとうございます。",
      note:"待たせたことへの感謝。謝罪の <b>sorry</b> より前向きな印象を与えます。" },
    { en:"My apologies for the delay.",
      ja:"遅くなり申し訳ございません。",
      note:"対応の遅れを詫びる標準的な表現。ビジネスメールの謝罪部分で頻出。" },
    { en:"Please bear with me on this.",
      ja:"少々お時間をいただけますと幸いです。",
      note:"<b>bear with me</b> は「もう少し我慢して待ってほしい」という丁寧な依頼。" },
    { en:"Let's align on next steps.",
      ja:"次のステップについてすり合わせましょう。",
      note:"<b>align on</b> は「足並みを揃える」。会議の終わりに次の行動を確認する際に。" },
    { en:"Can we push the deadline back?",
      ja:"締切を後ろに延ばすことは可能ですか。",
      note:"<b>push back</b> はここでは「(日程を)後ろにずらす」という意味で使われています。" },
    { en:"I'll follow up with the details.",
      ja:"詳細は追ってご連絡します。",
      note:"<b>follow up</b> は「その後の対応をする」。メールの締めくくりに非常に多用されます。" },
    { en:"Just a gentle reminder about this.",
      ja:"念のため、こちらリマインドです。",
      note:"<b>gentle reminder</b> は柔らかい催促の定型句。督促メールの冒頭でよく使われます。" },
    { en:"Thanks for flagging this.",
      ja:"ご指摘ありがとうございます。",
      note:"<b>flag</b> は「問題として挙げる」。指摘してくれたことへの感謝表現。" }
  ];

  // --- 表示するフレーズをランダムに3つ選ぶ ---
  function pick(n){
    const pool = PHRASES.slice();
    const out = [];
    for(let i=0; i<n && pool.length; i++){
      out.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
    }
    return out;
  }

  const selected = pick(PHRASE_COUNT);

  const enEl = document.getElementById('en');
  const jaEl = document.getElementById('ja');
  const noteEl = document.getElementById('note');
  const cardEl = document.getElementById('card');
  const segEl = document.getElementById('seg');
  const barFill = document.getElementById('barFill');
  const timecodeEl = document.getElementById('timecode');
  const actionsEl = document.getElementById('actions');
  const waitingEl = document.getElementById('waiting');
  const tallyEl = document.getElementById('tally');

  function render(i, animate){
    const p = selected[i];
    const apply = () => {
      enEl.textContent = p.en;
      jaEl.textContent = p.ja;
      noteEl.innerHTML = p.note;
      segEl.textContent = (i+1) + '/' + PHRASE_COUNT;
      cardEl.classList.remove('fading');
    };
    if(animate){
      cardEl.classList.add('fading');
      setTimeout(apply, 450);
    } else {
      apply();
    }
  }

  render(0, false);

  let elapsed = 0;
  let shownIndex = 0;

  function fmt(sec){
    const m = Math.floor(sec/60);
    const s = String(sec % 60).padStart(2,'0');
    return m + ':' + s;
  }

  const timer = setInterval(() => {
    elapsed += 1;
    const remaining = DURATION - elapsed;

    timecodeEl.textContent = fmt(Math.max(remaining, 0));
    barFill.style.width = (elapsed / DURATION * 100) + '%';

    const idx = Math.min(Math.floor(elapsed / SLOT), PHRASE_COUNT - 1);
    if(idx !== shownIndex){
      shownIndex = idx;
      render(idx, true);
    }

    if(remaining <= 0){
      clearInterval(timer);
      timecodeEl.textContent = '0:00';
      waitingEl.style.display = 'none';
      actionsEl.classList.add('ready');
      recordOpen();
    }
  }, 1000);

  document.getElementById('goBtn').addEventListener('click', () => {
    const fallback = setTimeout(() => {
      window.location.href = INSTAGRAM_WEB_URL;
    }, 1200);
    window.addEventListener('pagehide', () => clearTimeout(fallback), { once:true });
    window.location.href = INSTAGRAM_APP_URL;
  });

  document.getElementById('skipBtn').addEventListener('click', () => {
    document.body.innerHTML =
      '<div style="flex:1;display:flex;align-items:center;justify-content:center;font-family:Newsreader,serif;font-style:italic;font-size:20px;color:#EDEBE5;text-align:center;padding:40px;">このタブを閉じて大丈夫です。</div>';
  });

  function recordOpen(){
    const today = new Date().toISOString().slice(0,10);
    const key = 'gate_tally';
    let data = {};
    try{ data = JSON.parse(localStorage.getItem(key) || '{}'); }catch(e){}
    data[today] = (data[today] || 0) + 1;
    localStorage.setItem(key, JSON.stringify(data));
    tallyEl.textContent = '今日 ' + data[today] + ' 回目 ・ ' +
      (data[today] * PHRASE_COUNT) + ' フレーズ学習';
  }
</script>

</body>
</html>
